<!DOCTYPE html>
<html>
    <head>
        <title>REGISTRATION FORM</title>

    <body>
           <form> 
            <h1>Registration form</h1>
            <lable for="fname"> First name: </lable>
            <br>
            <input type="text"name>
            <br><br>

            <br>
            <input type="text"name>

            <lable for="female">Female</lable>

            <lable for="No."> Contact: </lable>
            <br>
            <input checkbox="contact">
            <br>
            <lable for="ID"> Email-ID:</lable>
            <br>
            <input email="Email ID">
            <br>
            <lable for="address"> Note: </lable>
            <br>
            <textarea id="address" rows="2" cols="20">write here,FEEDBACK </textarea>
            <br>
            <input type="submit">
            <input type="reset" value="Reset">      
          </form>
    </body>
</html>
